# nginx site for portfolio.sahellx.site — the Next.js container from
# ../docker-compose.yml.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/portfolio
#   sudo ln -s /etc/nginx/sites-available/portfolio /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d portfolio.sahellx.site
#   sudo nginx -t && sudo systemctl reload nginx
#
# The upstream port below must match PORT in frontend/.env — nginx cannot read
# that file, so it is the one place the number is repeated. If you change PORT,
# change it here too.

upstream portfolio_frontend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name portfolio.sahellx.site;

    # certbot replaces this block with a 301 to https once a cert is issued.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name portfolio.sahellx.site;

    # `http2 on;` needs nginx >= 1.25.1. On older builds drop that line and
    # write the listeners as `listen 443 ssl http2;` instead.

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/portfolio.sahellx.site/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/portfolio.sahellx.site/privkey.pem;

    # The contact form posts a small JSON body; nothing here uploads.
    client_max_body_size 1m;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;

    # No /_next/static/ block on purpose: Next already serves content-hashed
    # assets with `Cache-Control: public, max-age=31536000, immutable`, and a
    # second add_header here would send the header twice.

    location / {
        proxy_pass http://portfolio_frontend;
        proxy_http_version 1.1;
        # Empty Connection header + upstream keepalive: reuse the connection
        # rather than opening a socket per request.
        proxy_set_header Connection "";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }
}
