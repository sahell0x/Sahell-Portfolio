# nginx site for voice.sahellx.site
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/voice-agent
#   sudo ln -s /etc/nginx/sites-available/voice-agent /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d voice.sahellx.site
#   sudo nginx -t && sudo systemctl reload nginx
#
# The upstream port below (8000) must match PORT in backend/.env — nginx cannot
# read that file, so it is the one place the number is repeated.
#
# TLS is not optional: the portfolio is served over HTTPS, so a plain-http API
# — and a plain-ws socket — is blocked as mixed content and the assistant
# silently fails to connect.

server {
    listen 80;
    listen [::]:80;
    server_name voice.sahellx.site;

    # certbot replaces this block with a 301 to https once a cert is issued.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name voice.sahellx.site;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/voice.sahellx.site/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/voice.sahellx.site/privkey.pem;

    # Nothing serves /internal/ any more — page-control tools reach the browser
    # down the conversation's own socket. Kept as a standing guard so anything
    # added under this prefix later is private by default rather than by
    # remembering to be.
    location /internal/ {
        return 404;
    }

    # The conversation itself. A voice call is a socket that stays open and
    # mostly silent in one direction, so it needs both the upgrade handshake and
    # a read timeout longer than the longest session — nginx's default 60s would
    # cut a visitor off mid-sentence.
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Audio is small and continuous; buffering it only adds latency.
        proxy_buffering off;

        proxy_connect_timeout 10s;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The rate limiter reads this. Use $remote_addr, not
        # $proxy_add_x_forwarded_for, so a client-supplied header cannot be
        # prepended to forge an IP and reset its own quota.
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
    }
}
